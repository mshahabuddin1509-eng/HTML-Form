    <h1>Basic HTML Form</h1>

    <form>
        <!-- Name Fieldset -->
        <fieldset>
            <legend>Name</legend>
            <p>
                <label for="first-name">First Name</label><br>
                <input type="text" id="first-name" name="firstName">
            </p>
            <p>
                <label for="last-name">Last Name</label><br>
                <input type="text" id="last-name" name="lastName">
            </p>
        </fieldset>

        <br>

        <!-- Other Questions Fieldset -->
        <fieldset>
            <legend>Other Questions</legend>
            
            <!-- Radio Buttons -->
            <p>Choose a drink:</p>
            <input type="radio" id="coffee" name="drink" value="coffee">
            <label for="coffee">coffee</label><br>
            
            <input type="radio" id="tea" name="drink" value="tea" checked>
            <label for="tea">tea</label><br>
            
            <input type="radio" id="hot-chocolate" name="drink" value="hot-chocolate">
            <label for="hot-chocolate">hot chocolate</label>

            <!-- Checkboxes -->
            <p>What ice cream do you like?</p>
            <input type="checkbox" id="chocolate" name="iceCream" value="chocolate">
            <label for="chocolate">Chocolate</label><br>
            
            <input type="checkbox" id="chocolate-pudding" name="iceCream" value="chocolate-pudding">
            <label for="chocolate-pudding">Chocolate Pudding</label><br>
            
            <input type="checkbox" id="chocolate-peanut-butter" name="iceCream" value="chocolate-peanut-butter" checked>
            <label for="chocolate-peanut-butter">Chocolate Peanut Butter</label><br>
            
            <input type="checkbox" id="vanilla" name="iceCream" value="vanilla">
            <label for="vanilla">Vanilla</label><br>
            
            <input type="checkbox" id="strawberry" name="iceCream" value="strawberry">
            <label for="strawberry">Strawberry</label>

            <!-- Dropdown Select -->
            <p>
                <label for="school">Select a school:</label><br>
                <select id="school" name="school">
                    <option value="harvard">Harvard</option>
                    <option value="mit">MIT</option>
                    <option value="stanford">Stanford</option>
                </select>
            </p>

            <!-- Textarea -->
            <p>
                <label for="comments">Please provide comments:</label><br>
                <textarea id="comments" name="comments" rows="4" cols="30"></textarea>
            </p>
        </fieldset>

        <br>

        <!-- Submit Button -->
        <input type="submit" value="Submit">
    </form>

</body>
</html>
