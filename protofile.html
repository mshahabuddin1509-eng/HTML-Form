<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Details Form</title>
</head>
<body>
    <a href="index.html">1</a>
    <a href="about.html">2</a>
    <a href="photo.html">3</a>
    <a href="contact.html">4</a>
    <a href="protofile.html">5</a>

    <form>
        <!-- Employee Details Section Border -->
        <fieldset>
            <legend>Employee Details</legend>
            
            <!-- Text Inputs with Labels -->
            <p>
                <label for="first-name">First name:</label>
                <input type="text" id="first-name" name="firstName">
            </p>
            
            <p>
                <label for="last-name">Last name:</label>
                <input type="text" id="last-name" name="lastName">
            </p>
            
            <!-- Radio Buttons for Gender Selection -->
            <p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </p>
            
            <p>
                <label for="employee-id">Employee ID:</label>
                <input type="text" id="employee-id" name="employeeId">
            </p>
            
            <p>
                <label for="designation">Designation:</label>
                <input type="text" id="designation" name="designation">
            </p>
            
            <p>
                <label for="phone-number">Phone Number:</label>
                <input type="text" id="phone-number" name="phoneNumber">
            </p>
            
            <!-- Form Action Button -->
            <p>
                <input type="submit" value="Submit">
            </p>
        </fieldset>
    </form>

</body>
</html>
